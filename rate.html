<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Rate Font Smooth">
  <title>Rate Font Smooth | Zema Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<body class="success-body">
<header class="site-header">
  <div class="shell nav-shell">
    <a class="brand brand-lockup" href="/"><img class="brand-mark" src="zema-tools-logo.png" alt="" width="28" height="28"><span>Zema Tools</span></a>
    <nav class="nav"><a href="/#support">Support</a></nav>
  </div>
</header>

<main class="success-main shell">
  <section class="success-card">
    <p class="eyebrow">Font Smooth</p>
    <div class="success-status">Firefox and Opera</div>
    <h1 class="success-title">Thanks for using Font Smooth.</h1>
    <p class="success-lead">Share your experience on the extension store for the browser you use.</p>

    <div class="success-help">
      <a class="button button-dark" href="https://addons.mozilla.org/firefox/addon/font-smooth/" target="_blank" rel="noopener noreferrer">Rate on Firefox</a>
      <a class="button button-dark" href="https://addons.opera.com/en/extensions/details/font-smooth/" target="_blank" rel="noopener noreferrer">Rate on Opera</a>
    </div>

    <div class="success-help">
      <a class="text-link" href="/">Back to Font Smooth <span>↗</span></a>
      <a class="text-link" href="/#support">Send feedback <span>↗</span></a>
    </div>
  </section>
</main>
</body>
