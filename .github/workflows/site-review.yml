name: Website review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - name: Package static preview
        if: always()
        run: |
          mkdir -p review/website
          cp *.html *.css site.js success.js checkout-return.js zema-tools-logo.png review/website/
          cp -R assets review/website/
          cp README.md review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-review
          path: |
            review/
            playwright-report/
            test-results/
          retention-days: 14
